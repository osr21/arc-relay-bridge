kind = "video"
previewPath = "/arc-tutorial/"
title = "Arc Bridge Tutorial"
version = "1.0.0"
id = "artifacts/arc-tutorial"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/arc-tutorial/" ]
localPort = 23362

[services.development]
run = "pnpm --filter @workspace/arc-tutorial run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arc-tutorial", "run", "build" ]
publicDir = "artifacts/arc-tutorial/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23362"
BASE_PATH = "/arc-tutorial/"
