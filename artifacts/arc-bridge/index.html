<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Content-Security-Policy:
         script-src 'self' 'unsafe-inline' — Vite injects inline module preload scripts; unsafe-inline needed for production bundle.
         style-src 'self' 'unsafe-inline' — Tailwind + shadcn inject inline styles at runtime.
         connect-src 'self' https: wss: — ethers.js connects to public RPC endpoints (arc.network, publicnode.com, base.org, etc.).
         frame-ancestors 'none' — prevents clickjacking by disallowing this page inside any iframe.
         form-action 'self' — no HTML form submissions go off-origin.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; form-action 'self';" />
    <title>Arc Relay Bridge</title>
    <meta name="description" content="Arc Relay Bridge — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Arc Relay Bridge" />
    <meta property="og:description" content="Arc Relay Bridge — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arc Relay Bridge" />
    <meta name="twitter:description" content="Arc Relay Bridge — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
