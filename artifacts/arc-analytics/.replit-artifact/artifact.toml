kind = "web"
previewPath = "/arc-analytics/"
title = "Arc Analytics"
version = "1.0.0"
id = "artifacts/arc-analytics"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/arc-analytics/" ]
localPort = 20677

[services.development]
run = "pnpm --filter @workspace/arc-analytics run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arc-analytics", "run", "build" ]
publicDir = "artifacts/arc-analytics/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20677"
BASE_PATH = "/arc-analytics/"
