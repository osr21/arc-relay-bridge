openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: network
    description: Public network profile and readiness operations
  - name: indexer
    description: Arc event indexer — USDC transfers, memos, CCTP bridge events
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /network-status:
    get:
      operationId: getNetworkStatus
      tags: [network]
      summary: Get active network environment and mainnet readiness
      description: |
        Returns public readiness information only. Mainnet is fail-closed while
        preparing; no deployment credentials or operational secrets are exposed.
      responses:
        "200":
          description: Network profile and readiness state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkStatus"

  /chains:
    get:
      operationId: getChains
      tags: [network]
      summary: List chains available in the active network profile
      description: |
        In the mainnet preparing profile this returns only official Arc (5042)
        and Base (8453) network descriptors. It does not publish unreviewed
        custom deployment addresses or relay fees.
      responses:
        "200":
          description: Active chain descriptors
          content:
            application/json:
              schema:
                type: object
                required: [chains]
                properties:
                  chains:
                    type: array
                    items:
                      $ref: "#/components/schemas/NetworkChain"

  /indexer/transfers:
    get:
      operationId: getTransfers
      tags: [indexer]
      summary: List indexed USDC transfers
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [NATIVE_SEND, MINT, BURN] }
        - name: txHash
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
      responses:
        "200":
          description: Paginated transfer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferPage"

  /indexer/memos:
    get:
      operationId: getMemos
      tags: [indexer]
      summary: List indexed memo events
      parameters:
        - name: sender
          in: query
          schema: { type: string }
        - name: target
          in: query
          schema: { type: string }
        - name: memoId
          in: query
          schema: { type: string }
        - name: txHash
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
      responses:
        "200":
          description: Paginated memo list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoPage"

  /indexer/cctp/burns:
    get:
      operationId: getCctpBurns
      tags: [indexer]
      summary: List indexed CCTP burn events
      parameters:
        - name: depositor
          in: query
          schema: { type: string }
        - name: destDomain
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, COMPLETE, STUCK] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
      responses:
        "200":
          description: Paginated CCTP burn list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CctpBurnPage"

  /indexer/cctp/mints:
    get:
      operationId: getCctpMints
      tags: [indexer]
      summary: List indexed CCTP mint events
      parameters:
        - name: recipient
          in: query
          schema: { type: string }
        - name: remoteDomain
          in: query
          schema: { type: integer }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
      responses:
        "200":
          description: Paginated CCTP mint list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CctpMintPage"

  /indexer/stats:
    get:
      operationId: getIndexerStats
      tags: [indexer]
      summary: Aggregate indexer statistics and bridge analytics
      responses:
        "200":
          description: Indexer stats and CCTP domain breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexerStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    NetworkFeature:
      type: object
      required: [enabled, reason]
      properties:
        enabled: { type: boolean }
        reason: { type: string }

    MainnetReadiness:
      type: object
      required: [stage, live, features]
      properties:
        stage: { type: string, enum: [preparing] }
        live: { type: boolean, const: false }
        features:
          type: object
          required: [bridge, relay, gasless, refuel, yield]
          properties:
            bridge: { $ref: "#/components/schemas/NetworkFeature" }
            relay: { $ref: "#/components/schemas/NetworkFeature" }
            gasless: { $ref: "#/components/schemas/NetworkFeature" }
            refuel: { $ref: "#/components/schemas/NetworkFeature" }
            yield: { $ref: "#/components/schemas/NetworkFeature" }

    NetworkChain:
      type: object
      required: [id, name, shortName, cctpDomain, usdcAddress, explorerUrl, rpcUrl]
      properties:
        id: { type: integer }
        name: { type: string }
        shortName: { type: string }
        cctpDomain: { type: integer }
        usdcAddress: { type: string }
        tokenMessenger: { type: string }
        messageTransmitter: { type: string }
        explorerUrl: { type: string, format: uri }
        rpcUrl: { type: string, format: uri }
        cctpVersion: { type: integer }
        minFinalityThreshold: { type: integer }
        isArc: { type: boolean }
        nativeCurrency:
          type: object
          required: [name, symbol, decimals]
          properties:
            name: { type: string }
            symbol: { type: string }
            decimals: { type: integer }

    NetworkStatus:
      type: object
      required: [environment, configurationValid, mainnet, activeChains]
      properties:
        environment: { type: string, enum: [mainnet, testnet] }
        configurationValid:
          type: boolean
          description: False when ARC_NETWORK_ENV was malformed and mainnet fail-closed mode was selected.
        mainnet: { $ref: "#/components/schemas/MainnetReadiness" }
        activeChains:
          type: array
          items: { $ref: "#/components/schemas/NetworkChain" }

    MainnetNotReady:
      type: object
      required: [error, code, environment, stage, feature, reason]
      properties:
        error: { type: string }
        code: { type: string, const: MAINNET_NOT_READY }
        environment: { type: string, const: mainnet }
        stage: { type: string, const: preparing }
        feature: { type: string, enum: [bridge, relay, gasless, refuel, yield, testnet-data] }
        reason: { type: string }

    UsdcTransfer:
      type: object
      required: [id, blockNumber, txHash, fromAddress, toAddress, amountNative, amountUsdc, transferType, isNativeLog]
      properties:
        id:           { type: string }
        blockNumber:  { type: string }
        blockTime:    { type: ["string", "null"] }
        txHash:       { type: string }
        logIndex:     { type: string }
        fromAddress:  { type: string }
        toAddress:    { type: string }
        amountNative: { type: string }
        amountUsdc:   { type: string }
        transferType: { type: string }
        isNativeLog:  { type: boolean }

    TransferPage:
      type: object
      required: [data, total, page, limit]
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/UsdcTransfer" } }
        total: { type: integer }
        page:  { type: integer }
        limit: { type: integer }

    MemoEvent:
      type: object
      required: [id, blockNumber, txHash, sender, target, memoId, memoData, memoIndex]
      properties:
        id:           { type: string }
        blockNumber:  { type: string }
        blockTime:    { type: ["string", "null"] }
        txHash:       { type: string }
        sender:       { type: string }
        target:       { type: string }
        callDataHash: { type: string }
        memoId:       { type: string }
        memoData:     { type: string }
        memoText:     { type: ["string", "null"] }
        memoIndex:    { type: string }

    MemoPage:
      type: object
      required: [data, total, page, limit]
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/MemoEvent" } }
        total: { type: integer }
        page:  { type: integer }
        limit: { type: integer }

    CctpBurn:
      type: object
      required: [id, blockNumber, txHash, sourceDomain, destinationDomain, amount, depositor, attestationStatus]
      properties:
        id:                { type: string }
        blockNumber:       { type: string }
        blockTime:         { type: ["string", "null"] }
        txHash:            { type: string }
        sourceDomain:      { type: integer }
        destinationDomain: { type: integer }
        burnToken:         { type: string }
        amount:            { type: string }
        depositor:         { type: string }
        mintRecipient:     { type: string }
        nonce:             { type: string }
        destinationCaller: { type: string }
        attestationStatus: { type: string }
        mintEventId:       { type: ["string", "null"] }

    CctpBurnPage:
      type: object
      required: [data, total, page, limit]
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/CctpBurn" } }
        total: { type: integer }
        page:  { type: integer }
        limit: { type: integer }

    CctpMint:
      type: object
      required: [id, blockNumber, txHash, destinationDomain, remoteDomain, amount, mintRecipient]
      properties:
        id:                { type: string }
        blockNumber:       { type: string }
        blockTime:         { type: ["string", "null"] }
        txHash:            { type: string }
        destinationDomain: { type: integer }
        remoteDomain:      { type: integer }
        mintRecipient:     { type: string }
        amount:            { type: string }
        mintToken:         { type: string }
        nonce:             { type: string }
        burnEventId:       { type: ["string", "null"] }

    CctpMintPage:
      type: object
      required: [data, total, page, limit]
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/CctpMint" } }
        total: { type: integer }
        page:  { type: integer }
        limit: { type: integer }

    DomainBreakdown:
      type: object
      required: [destDomain, count, domainName]
      properties:
        destDomain:   { type: integer }
        count:        { type: integer }
        totalAmount:  { type: ["string", "null"] }
        domainName:   { type: string }

    MintDomainBreakdown:
      type: object
      required: [remoteDomain, count, domainName]
      properties:
        remoteDomain: { type: integer }
        count:        { type: integer }
        totalAmount:  { type: ["string", "null"] }
        domainName:   { type: string }

    IndexerState:
      type: object
      properties:
        id:               { type: string }
        lastIndexedBlock: { type: integer }
        totalTransfers:   { type: integer }
        totalMemos:       { type: integer }
        totalCctpBurns:   { type: integer }
        totalCctpMints:   { type: integer }

    IndexerStats:
      type: object
      required: [cctpBurnsByDestination, cctpMintsBySource]
      properties:
        indexer:               { $ref: "#/components/schemas/IndexerState" }
        cctpBurnsByDestination:
          type: array
          items: { $ref: "#/components/schemas/DomainBreakdown" }
        cctpMintsBySource:
          type: array
          items: { $ref: "#/components/schemas/MintDomainBreakdown" }
